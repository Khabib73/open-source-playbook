site_name: open-source-playbook
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy

repo_url: https://github.com/Khabib73/open-source-playbook
repo_name: open-source-playbook

nav:
  - Home: index.md
  - Basics:
    - Bad vs Good patterns: basics/bad-vs-good.md
  - Communication intents:
      - Saying thanks: intents/thanks.md
      - Asking for help: intents/asking-help.md
      - Giving code feedback: intents/code-feedback.md
      - Proposing changes: intents/proposing-changes.md
      - Handling disagreements: intents/disagreements.md
      - Asking to be assigned: intents/assignment.md